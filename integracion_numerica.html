<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integración numérica: rectángulos y trapecios</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; padding: 24px; background: #f5f6f8; color: #1f2430;
  }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: #5b6270; margin: 0 0 20px; }
  .card {
    background: #fff; border: 1px solid #e2e5ea; border-radius: 10px;
    padding: 18px; margin-bottom: 16px;
  }
  .grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; }
  label { display: block; font-size: .85rem; color: #5b6270; margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 8px 10px; font-size: 1rem;
    border: 1px solid #cfd4dc; border-radius: 6px; font-family: inherit;
  }
  .row { display: flex; gap: 12px; align-items: end; margin-top: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 220px; }
  button {
    padding: 9px 22px; font-size: 1rem; border: 0; border-radius: 6px;
    background: #2f6fd6; color: #fff; cursor: pointer;
  }
  button:hover { background: #255bb3; }
  .hint { font-size: .8rem; color: #7a818e; margin-top: 8px; }
  .error { color: #b3261e; font-weight: 600; }
  .resultado { font-size: 1.6rem; font-weight: 700; margin: 4px 0 2px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #eceef2; }
  th { font-size: .85rem; color: #5b6270; font-weight: 600; }
  tr.activo { background: #eef3fc; }
  canvas { width: 100%; height: 360px; display: block; }
  .formula { font-family: Georgia, serif; font-size: .95rem; color: #3a404c; margin: 6px 0; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Integración numérica</h1>
  <p class="sub">Método de rectángulos y método de trapecios</p>

  <section class="card">
    <div class="grid">
      <div>
        <label for="fx">f(x)</label>
        <input id="fx" value="x^2">
      </div>
      <div>
        <label for="a">Límite inferior a</label>
        <input id="a" value="0">
      </div>
      <div>
        <label for="b">Límite superior b</label>
        <input id="b" value="3">
      </div>
      <div>
        <label for="n">Subintervalos n</label>
        <input id="n" type="number" min="1" value="10">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="metodo">Método</label>
        <select id="metodo">
          <option value="izquierdo">Rectángulos (extremo izquierdo)</option>
          <option value="derecho">Rectángulos (extremo derecho)</option>
          <option value="medio">Rectángulos (punto medio)</option>
          <option value="trapecio" selected>Trapecios</option>
        </select>
      </div>
      <div style="flex:0"><button id="calcular">Calcular</button></div>
    </div>
    <p class="hint">
      Puedes usar: + − * / ^, sin, cos, tan, exp, log (ln), log10, sqrt, abs, pi, e.
      Ejemplos: <code>sin(x)</code>, <code>exp(-x^2)</code>, <code>1/(1+x^2)</code>. Los límites también aceptan expresiones como <code>pi/2</code>.
    </p>
  </section>

  <section class="card" id="salida">
    <div id="titulo"></div>
    <div class="resultado" id="resultado"></div>
    <div class="formula" id="formula"></div>
    <table>
      <thead><tr><th>Método</th><th>Aproximación</th></tr></thead>
      <tbody id="tabla"></tbody>
    </table>
  </section>

  <section class="card">
    <canvas id="grafica"></canvas>
    <p class="hint" id="notaGrafica"></p>
  </section>
</main>

<script>
// ------------------------------------------------------------ Funciones
function crearFuncion(expr) {
  const js = expr.replace(/\^/g, "**").replace(/\bln\b/g, "log");
  // Solo se permiten letras que formen nombres de Math o la variable x
  const nombres = js.match(/[A-Za-z_]\w*/g) || [];
  const validos = new Set(["x", "sin", "cos", "tan", "asin", "acos", "atan", "sinh",
    "cosh", "tanh", "exp", "log", "log10", "log2", "sqrt", "cbrt", "abs", "pi", "e",
    "PI", "E", "floor", "ceil", "round", "sign", "min", "max", "pow"]);
  for (const nom of nombres) {
    if (!validos.has(nom)) throw new Error(`nombre desconocido "${nom}"`);
  }
  const f = new Function("x",
    "const pi = Math.PI, e = Math.E; with (Math) { return (" + js + "); }");
  return x => Number(f(x));
}

function leerNumero(texto) {
  const v = crearFuncion(texto)(0);
  if (!isFinite(v)) throw new Error(`"${texto}" no es un número válido`);
  return v;
}

// ------------------------------------------------------------ Métodos
// Rectángulos: h · Σ f(x_i), con x_i en el extremo izquierdo, derecho o punto medio
function rectangulos(f, a, b, n, tipo) {
  const h = (b - a) / n;
  const desplazamiento = { izquierdo: 0, derecho: 1, medio: 0.5 }[tipo];
  let suma = 0;
  for (let i = 0; i < n; i++) suma += f(a + (i + desplazamiento) * h);
  return h * suma;
}

// Trapecios: h/2 · [f(x0) + 2f(x1) + ... + 2f(x_{n-1}) + f(xn)]
function trapecios(f, a, b, n) {
  const h = (b - a) / n;
  let suma = f(a) + f(b);
  for (let i = 1; i < n; i++) suma += 2 * f(a + i * h);
  return (h / 2) * suma;
}

const METODOS = {
  izquierdo: { nombre: "Rectángulos (izquierdo)", calc: (f, a, b, n) => rectangulos(f, a, b, n, "izquierdo"),
               formula: "h · [f(x₀) + f(x₁) + … + f(xₙ₋₁)]" },
  derecho:   { nombre: "Rectángulos (derecho)",   calc: (f, a, b, n) => rectangulos(f, a, b, n, "derecho"),
               formula: "h · [f(x₁) + f(x₂) + … + f(xₙ)]" },
  medio:     { nombre: "Rectángulos (punto medio)", calc: (f, a, b, n) => rectangulos(f, a, b, n, "medio"),
               formula: "h · Σ f((xᵢ + xᵢ₊₁)/2)" },
  trapecio:  { nombre: "Trapecios", calc: trapecios,
               formula: "h/2 · [f(x₀) + 2f(x₁) + … + 2f(xₙ₋₁) + f(xₙ)]" },
};

const fmt = v => isFinite(v) ? v.toFixed(10) : "no definido";

// ------------------------------------------------------------ Gráfica
function dibujar(f, a, b, n, metodo) {
  const canvas = document.getElementById("grafica");
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const margen = 40;
  const pasos = 400;
  const xs = [], ys = [];
  for (let i = 0; i <= pasos; i++) {
    const x = a + (b - a) * i / pasos;
    const y = f(x);
    xs.push(x); ys.push(isFinite(y) ? y : NaN);
  }
  const validos = ys.filter(isFinite);
  let ymin = Math.min(0, ...validos), ymax = Math.max(0, ...validos);
  if (ymax === ymin) { ymax += 1; ymin -= 1; }
  const pad = (ymax - ymin) * 0.08; ymax += pad; ymin -= pad;

  const X = x => margen + (x - a) / (b - a) * (W - 2 * margen);
  const Y = y => H - margen - (y - ymin) / (ymax - ymin) * (H - 2 * margen);

  // Ejes
  ctx.strokeStyle = "#9aa1ad"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(margen, Y(0)); ctx.lineTo(W - margen, Y(0)); ctx.stroke();
  ctx.fillStyle = "#5b6270"; ctx.font = "12px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(+a.toFixed(3), X(a), H - margen + 16);
  ctx.fillText(+b.toFixed(3), X(b), H - margen + 16);
  ctx.textAlign = "right";
  ctx.fillText(+ymax.toFixed(2), margen - 4, margen + 4);
  ctx.fillText(+ymin.toFixed(2), margen - 4, H - margen);

  // Figuras del método
  const nota = document.getElementById("notaGrafica");
  if (n <= 200) {
    const h = (b - a) / n;
    ctx.fillStyle = "rgba(47, 111, 214, 0.18)";
    ctx.strokeStyle = "rgba(47, 111, 214, 0.8)";
    for (let i = 0; i < n; i++) {
      const x0 = a + i * h, x1 = x0 + h;
      ctx.beginPath();
      if (metodo === "trapecio") {
        ctx.moveTo(X(x0), Y(0)); ctx.lineTo(X(x0), Y(f(x0)));
        ctx.lineTo(X(x1), Y(f(x1))); ctx.lineTo(X(x1), Y(0));
      } else {
        const d = { izquierdo: 0, derecho: 1, medio: 0.5 }[metodo];
        const alto = f(x0 + d * h);
        ctx.rect(X(x0), Y(0), X(x1) - X(x0), Y(alto) - Y(0));
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    nota.textContent = `Área azul: ${METODOS[metodo].nombre.toLowerCase()} con n = ${n}. Curva naranja: f(x).`;
  } else {
    nota.textContent = "Con n > 200 solo se dibuja la curva (las figuras serían demasiado delgadas).";
  }

  // Curva
  ctx.strokeStyle = "#e0701b"; ctx.lineWidth = 2.5;
  ctx.beginPath();
  let enTrazo = false;
  xs.forEach((x, i) => {
    if (!isFinite(ys[i])) { enTrazo = false; return; }
    enTrazo ? ctx.lineTo(X(x), Y(ys[i])) : ctx.moveTo(X(x), Y(ys[i]));
    enTrazo = true;
  });
  ctx.stroke();
}

// ------------------------------------------------------------ Programa
function calcular() {
  const titulo = document.getElementById("titulo");
  const resultado = document.getElementById("resultado");
  const formula = document.getElementById("formula");
  const tabla = document.getElementById("tabla");
  try {
    const texto = document.getElementById("fx").value.trim();
    const f = crearFuncion(texto);
    const a = leerNumero(document.getElementById("a").value);
    const b = leerNumero(document.getElementById("b").value);
    const n = parseInt(document.getElementById("n").value, 10);
    const metodo = document.getElementById("metodo").value;
    if (!(n >= 1)) throw new Error("n debe ser un entero mayor que 0");
    if (a === b) throw new Error("a y b deben ser distintos");

    const h = (b - a) / n;
    titulo.textContent = `∫ de ${+a.toFixed(6)} a ${+b.toFixed(6)} de  ${texto}  dx    (n = ${n}, h = ${+h.toFixed(8)})`;
    resultado.textContent = "≈ " + fmt(METODOS[metodo].calc(f, a, b, n));
    formula.textContent = METODOS[metodo].nombre + ":  " + METODOS[metodo].formula;

    tabla.innerHTML = "";
    for (const [clave, m] of Object.entries(METODOS)) {
      const tr = document.createElement("tr");
      if (clave === metodo) tr.className = "activo";
      tr.innerHTML = `<td>${m.nombre}</td><td>${fmt(m.calc(f, a, b, n))}</td>`;
      tabla.appendChild(tr);
    }
    dibujar(f, Math.min(a, b), Math.max(a, b), n, metodo);
  } catch (err) {
    titulo.innerHTML = `<span class="error">Error: ${err.message}</span>`;
    resultado.textContent = ""; formula.textContent = ""; tabla.innerHTML = "";
  }
}

document.getElementById("calcular").addEventListener("click", calcular);
document.getElementById("metodo").addEventListener("change", calcular);
document.querySelectorAll("input").forEach(el =>
  el.addEventListener("keydown", e => { if (e.key === "Enter") calcular(); }));
window.addEventListener("resize", calcular);
calcular();
</script>
</body>
</html>
